<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f0e7">
<title>A Little Note for You</title>
<style>
  :root { --paper:#fbf8f1; --ink:#263a32; --sage:#829786; --sage-dark:#526c5b; --rose:#c99b91; --line:#e5dfd2; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
    color:var(--ink); background:
      radial-gradient(circle at 12% 14%, #e8eee4 0 2px, transparent 3px),
      radial-gradient(circle at 84% 78%, #eadbd4 0 2px, transparent 3px),
      linear-gradient(135deg,#f1eee5,#e8eee7 55%,#f7eee9);
    font-family: Georgia, "Times New Roman", serif;
  }
  .wrap { width:min(100%,470px); }
  .topline { text-align:center; font:11px/1.5 Arial,sans-serif; letter-spacing:.24em; text-transform:uppercase; color:#718477; margin-bottom:14px; }
  .card {
    position:relative; overflow:hidden; min-height:510px; padding:clamp(26px,7vw,42px);
    background:rgba(255,253,248,.93); border:1px solid rgba(255,255,255,.9);
    border-radius:24px; box-shadow:0 24px 70px #34483a1b;
    display:flex; flex-direction:column; justify-content:center; text-align:center;
  }
  .card:before { content:""; position:absolute; inset:10px; border:1px solid var(--line); border-radius:17px; pointer-events:none; }
  .sprig { font-size:30px; color:var(--sage); margin-bottom:18px; }
  .eyebrow { font:11px Arial,sans-serif; letter-spacing:.19em; text-transform:uppercase; color:var(--sage-dark); margin-bottom:15px; }
  h1 { font-size:clamp(32px,8vw,44px); line-height:1.1; font-weight:normal; margin:0 0 18px; }
  p { font-size:17px; line-height:1.75; color:#58665b; margin:0 auto 18px; max-width:340px; }
  .tiny { font:12px Arial,sans-serif; color:#879287; letter-spacing:.04em; margin-top:6px; }
  button {
    position:relative; z-index:1; border:0; border-radius:999px; padding:14px 22px;
    background:var(--sage-dark); color:white; font:13px Arial,sans-serif; letter-spacing:.04em;
    cursor:pointer; margin:10px auto 0; min-width:190px; transition:transform .2s, background .2s;
  }
  button:hover { transform:translateY(-2px); background:#3f5948; }
  button.secondary { background:transparent; color:var(--sage-dark); border:1px solid #cbd5c9; }
  .progress { display:flex; justify-content:center; gap:7px; margin:17px 0 0; }
  .dot { width:6px; height:6px; border-radius:50%; background:#cbd4c9; }
  .dot.active { background:var(--sage-dark); }
  .fade { animation:fade .42s ease both; }
  .memory { border-left:2px solid #c4d0c3; padding:9px 0 9px 14px; margin:8px auto; max-width:320px; text-align:left; font-size:16px; line-height:1.6; color:#58665b; }
  .heart { color:var(--rose); font-size:25px; margin:8px; }
  @keyframes fade { from {opacity:0; transform:translateY(8px)} to {opacity:1; transform:translateY(0)} }
  @media(max-height:650px) { .card {min-height:440px;padding:25px;} }
</style>
</head>
<body>
<main class="wrap">
  <div class="topline">a small thing, made for you</div>
  <section class="card" aria-live="polite">
    <div id="screen" class="fade">
      <div class="sprig">✳</div>
      <div class="eyebrow">for my favourite human</div>
      <h1>A little note<br>for you.</h1>
      <p>Nothing grand. Just a few words I wanted you to have, tucked into one tiny corner of the internet.</p>
      <button onclick="next()">Open your surprise ↗</button>
      <div class="tiny">made with care, just for you</div>
    </div>
  </section>
  <div class="progress" id="progress" aria-label="Page progress"></div>
</main>
<script>
const pages = [
  {
    eyebrow:"a reminder",
    title:"I'm glad<br>we became friends.",
    body:"Out of all the people life lets us meet, I'm genuinely glad our paths crossed. You make ordinary days feel a little less ordinary.",
    button:"Tell me more →"
  },
  {
    eyebrow:"the little things",
    title:"It's the small<br>things, really.",
    body:"The random conversations. The silly jokes. The moments when we don't need the perfect words. Those things matter more than they probably seem.",
    button:"One more thing →"
  },
  {
    eyebrow:"please remember",
    title:"You matter<br>more than you know.",
    body:"I hope you give yourself the same patience and kindness you give to other people. You deserve good days, soft moments, and people who show up for you.",
    button:"Keep going →"
  },
  {
    eyebrow:"a tiny collection",
    title:"Things I appreciate",
    body:"Your own way of seeing things. The moments you make me laugh. The fact that we can make memories out of the simplest stuff.",
    button:"There's a final note →"
  },
  {
    eyebrow:"the last page",
    title:"Here's to us. ♡",
    body:"Thank you for being part of my life. No big speech, no pressure to reply perfectly—just a little reminder that I'm rooting for you, today and always.",
    button:"Read it one more time ↺",
    final:true
  }
];
let index = -1;
const screen = document.getElementById("screen");
const progress = document.getElementById("progress");
function renderProgress(){
  progress.innerHTML = "";
  for(let i=0;i<pages.length+1;i++){
    const d=document.createElement("span"); d.className="dot"+(i===index+1?" active":""); d.classList.add("dot");
    progress.appendChild(d);
  }
}
function next(){
  if(index >= pages.length-1) { index=-1; showIntro(); return; }
  index++;
  const p=pages[index];
  screen.className="fade";
  screen.innerHTML = `
    <div class="sprig">${p.final ? "♡" : "✳"}</div>
    <div class="eyebrow">${p.eyebrow}</div>
    <h1>${p.title}</h1>
    <p>${p.body}</p>
    ${p.final ? '<div class="heart">✦ &nbsp; ♡ &nbsp; ✦</div>' : ''}
    <button onclick="next()">${p.button}</button>
    ${index>0 ? '<button class="secondary" onclick="back()">Go back</button>' : ''}
  `;
  renderProgress();
}
function back(){
  if(index<=0){ index=-1; showIntro(); return; }
  index-=2; next();
}
function showIntro(){
  screen.className="fade";
  screen.innerHTML=`<div class="sprig">✳</div><div class="eyebrow">for my favourite human</div><h1>A little note<br>for you.</h1><p>Nothing grand. Just a few words I wanted you to have, tucked into one tiny corner of the internet.</p><button onclick="next()">Open your surprise ↗</button><div class="tiny">made with care, just for you</div>`;
  renderProgress();
}
renderProgress();
</script>
</body>
</html>
